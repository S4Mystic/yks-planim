<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lyrica</title>
<style>
:root{--bg:#14161c;--yuzey:#1d2029;--yuzey2:#272b37;--yazi:#eceef4;--soluk:#9aa0b2;--vurgu:#8fb0ff;--yesil:#5ecb9a;--kirmizi:#ff7a7a;--cizgi:#2f3441}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
#app{display:flex;flex-direction:column;height:100%}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--soluk);font-size:14px}
main{flex:1;overflow-y:auto;padding:8px 16px 24px}
.sayfa{display:none}
.sayfa.acik{display:block}
.kart{background:var(--yuzey);border-radius:14px;padding:16px;margin-bottom:12px}
.kart h2{margin:0 0 8px;font-size:17px}
.sifreSatir{display:flex;gap:8px;align-items:center}
.sifreSatir input{flex:1;min-width:0;margin-top:0}
.gozBtn{flex:none;width:48px;height:48px;border:0;border-radius:12px;background:rgba(255,255,255,.08);color:var(--soluk);font-size:18px;cursor:pointer}
.soluk{color:var(--soluk);font-size:14px;margin:0}
.btn{display:block;width:100%;min-height:52px;padding:0 18px;margin-top:10px;border:0;border-radius:12px;background:var(--vurgu);color:#10131a;font-weight:600;font-size:16px;font-family:inherit;text-align:center;line-height:52px}
.btn.ikincil{background:var(--yuzey2);color:var(--yazi)}
nav{display:flex;background:var(--yuzey);border-top:1px solid var(--cizgi);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--soluk);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.aktif{color:var(--vurgu)}
a{color:var(--vurgu)}
label.alan{display:block;margin-top:12px;font-size:14px;color:var(--soluk)}
input[type=text],input[type=url],input[type=number],input[type=password],input[type=date],select,textarea{display:block;width:100%;min-height:48px;margin-top:6px;padding:10px 12px;border:1px solid var(--cizgi);border-radius:10px;background:var(--yuzey2);color:var(--yazi);font-family:inherit;font-size:16px}
textarea{min-height:110px}
.cipler{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cip input{display:none}
.cip span{display:block;min-width:44px;min-height:44px;line-height:44px;padding:0 10px;text-align:center;border-radius:10px;background:var(--yuzey2);color:var(--soluk)}
.cip input:checked+span{background:var(--vurgu);color:#10131a;font-weight:600}
.cubuk{height:8px;border-radius:4px;background:var(--yuzey2);margin:8px 0;overflow:hidden}
.cubuk div{height:100%;background:var(--yesil)}
.gun{margin:16px 0 4px;font-size:15px}
.plan{padding:8px 0;border-top:1px solid var(--cizgi);font-size:15px}
.plan a{display:inline-block;margin:6px 14px 2px 0;min-height:32px}
.satir{display:flex;align-items:center;gap:12px}
.sayi{font-size:34px;font-weight:700;line-height:1.1}
.gorev{display:flex;align-items:flex-start;border-top:1px solid var(--cizgi)}
.tikalan{flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.tikalan input{width:28px;height:28px;accent-color:var(--yesil)}
.gmetin{flex:1;padding:12px 0}
.gorev.bitti .gmetin{text-decoration:line-through;color:var(--soluk)}
.sil{flex:none;width:48px;height:52px;border:0;background:none;color:var(--soluk);font-size:20px}
.saat{font-size:54px;font-weight:700;text-align:center;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.ikili{display:flex;gap:10px}
.ikili .btn{flex:1}
.toplam{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--cizgi)}
.kayit{display:flex;align-items:center;border-top:1px solid var(--cizgi)}
.kayit div{flex:1;padding:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--yesil);color:#10131a;font-weight:600;padding:12px 20px;border-radius:12px;z-index:10}
.ekleSatir{display:flex;gap:8px;margin-top:10px}
.ekleSatir input{flex:1;min-width:0;margin-top:0}
.ekleSatir .btn{width:auto;margin-top:0;padding:0 18px;min-height:48px;line-height:48px}
#grafik{width:100%;height:220px;display:block}
.lej{margin-top:8px;font-size:14px;color:var(--soluk)}
.lej span{margin-right:14px}
.alt{display:flex;gap:8px;margin-bottom:12px}
.alt button{flex:1;min-height:48px;border:0;border-radius:10px;background:var(--yuzey);color:var(--soluk);font-size:16px;font-family:inherit}
.alt button.aktif{background:var(--vurgu);color:#10131a;font-weight:600}
/* ===== YENİ TASARIM: cam efekti ve animasyonlar ===== */
:root{--bg:#090b12;--yazi:#f1f3fa;--soluk:#9aa3ba;--yesil:#5be3b0;--kenar:rgba(255,255,255,.14);--degrade:linear-gradient(135deg,#86a8ff,#a78bfa);--sari:#ffd166}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,rgba(99,102,241,.55),transparent 70%),radial-gradient(35% 30% at 85% 30%,rgba(45,212,191,.32),transparent 70%),radial-gradient(45% 35% at 60% 90%,rgba(192,132,252,.38),transparent 70%);animation:akis 26s ease-in-out infinite alternate;will-change:transform}
#app{position:relative;z-index:1}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 6px}
header h1{font-size:32px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(135deg,#fff 0%,#a5b4ff 50%,#8fb0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 8px rgba(134,168,255,.3)}
header p{text-transform:capitalize}
main{padding:10px 16px 170px}
a{color:#9db6ff}
.kart{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--kenar);border-radius:24px;padding:18px;margin-bottom:14px;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:0 10px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04)}
.kart::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 38%)}
.kart>*{position:relative}
.kart h2{font-size:17px;font-weight:650;letter-spacing:-.2px;margin:0 0 10px}
.btn{border-radius:18px;background:var(--degrade);color:#0b0d14;box-shadow:0 8px 22px rgba(124,156,255,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,box-shadow .2s}
.btn.ikincil{background:rgba(255,255,255,.09);color:var(--yazi);border:1px solid var(--kenar);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.btn:active,nav button:active,.sil:active{transform:scale(.95)}
input[type=text],input[type=url],input[type=number],input[type=password],input[type=date],select,textarea{background:rgba(255,255,255,.07);border:1px solid var(--kenar);border-radius:14px;transition:border-color .2s,box-shadow .2s}
input[type]:focus,select:focus,textarea:focus{outline:0;border-color:#8fb0ff;box-shadow:0 0 0 3px rgba(143,176,255,.25)}
select option{background:#1a1d2b;color:#f1f3fa}
.cip span{border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--kenar);transition:all .2s}
.cip input:checked+span{background:var(--degrade);border-color:transparent;box-shadow:0 6px 16px rgba(124,156,255,.35)}
.cubuk{height:10px;border-radius:6px;background:rgba(255,255,255,.08)}
.cubuk div{border-radius:6px;background:linear-gradient(90deg,#5be3b0,#8fb0ff);transform-origin:left}
.sayi{font-size:38px;letter-spacing:-1px;background:linear-gradient(120deg,#fff,#a5b4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.gorev,.kayit,.toplam,.plan{border-top-color:rgba(255,255,255,.08)}
.gorev.bitti .gmetin{opacity:.55}
.tikalan input{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);display:grid;place-content:center;transition:background .2s,border-color .2s}
.tikalan input:checked{background:var(--yesil);border-color:var(--yesil)}
.tikalan input:checked::after{content:"";width:6px;height:12px;border:solid #0b0d14;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.alt button{border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--kenar);transition:all .2s}
.alt button.aktif{background:var(--degrade);border-color:transparent;box-shadow:0 6px 18px rgba(124,156,255,.35)}
.halka{width:230px;height:230px;margin:10px auto 16px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--kenar);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.14),rgba(255,255,255,.03) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 10px rgba(255,255,255,.03)}
.halka.calisiyor{animation:nabiz 2.6s ease-in-out infinite}
.halka .saat{font-size:38px;margin:0;background:linear-gradient(120deg,#fff,#a5b4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;gap:4px;padding:12px 6px calc(10px + env(safe-area-inset-bottom));border:0;background:linear-gradient(to top,rgba(9,11,18,.9),transparent)}
nav button{min-width:0;min-height:62px;font-size:8.5px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid var(--kenar);box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);transition:transform .2s,color .2s,background .2s,box-shadow .2s}
nav button svg{width:24px;height:24px}
nav button.aktif{color:#fff;background:linear-gradient(145deg,rgba(143,176,255,.5),rgba(167,139,250,.3));border-color:rgba(190,205,255,.55);box-shadow:0 8px 24px rgba(124,156,255,.4),inset 0 1px 0 rgba(255,255,255,.4);transform:translateY(-4px)}
nav button.aktif svg{animation:zipla .5s cubic-bezier(.3,1.6,.5,1)}
.toast{bottom:calc(112px + env(safe-area-inset-bottom));border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toastGir .3s}
.anim>*{animation:gir .5s cubic-bezier(.2,.8,.2,1) backwards}
.anim>:nth-child(2){animation-delay:.06s}.anim>:nth-child(3){animation-delay:.12s}.anim>:nth-child(4){animation-delay:.18s}.anim>:nth-child(5){animation-delay:.24s}.anim>:nth-child(6){animation-delay:.3s}.anim>:nth-child(n+7){animation-delay:.36s}
.anim .cubuk div{animation:dolum .9s cubic-bezier(.2,.8,.2,1) .2s backwards}
@keyframes akis{to{transform:translate3d(4%,6%,0) scale(1.15)}}
@keyframes gir{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes dolum{from{transform:scaleX(0)}}
@keyframes zipla{from{transform:scale(.7) translateY(4px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes nabiz{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 10px rgba(143,176,255,.06),0 0 40px rgba(143,176,255,.15)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 18px rgba(143,176,255,.10),0 0 70px rgba(167,139,250,.35)}}
@keyframes toastGir{from{opacity:0;transform:translate(-50%,12px)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ===== PROGRAM: gün kopyala/yapıştır simgeleri ===== */
.kart>.gunAraclar{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2}
.gunAraclar button{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:12px;border:1px solid var(--kenar);background:rgba(255,255,255,.08);color:var(--yazi);transition:transform .15s,opacity .2s}
.gunAraclar button svg{width:18px;height:18px}
.gunAraclar button:active{transform:scale(.9)}
.gunAraclar button.pasif{opacity:.35}
.gunAraclar button.dolu{border-color:rgba(143,176,255,.7);background:rgba(143,176,255,.22)}

/* ===== DODO AI: buton ve panel ===== */
#dodoBtn{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:8;width:56px;height:56px;border-radius:50%;border:1px solid rgba(190,205,255,.5);background:linear-gradient(145deg,rgba(143,176,255,.55),rgba(167,139,250,.4));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 18px rgba(143,176,255,.35),inset 0 1px 0 rgba(255,255,255,.45);font-size:28px;line-height:1;padding:0;display:grid;place-items:center;transition:transform .2s,opacity .2s}
#dodoBtn:active{transform:scale(.92)}
body.dodoAcik #dodoBtn{opacity:0;pointer-events:none;transform:scale(.7)}
#dodoPerde{position:fixed;inset:0;z-index:20;background:rgba(3,4,10,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
#dodoPanel{position:fixed;left:0;right:0;bottom:0;z-index:21;height:75vh;height:75dvh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;border:1px solid var(--kenar);border-bottom:0;background:linear-gradient(160deg,rgba(40,44,70,.96),rgba(14,16,28,.98));box-shadow:0 -12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);transform:translateY(100%);opacity:0;visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .25s}
body.dodoAcik #dodoPerde{opacity:1;pointer-events:auto}
body.dodoAcik #dodoPanel{transform:translateY(0);opacity:1;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s}
.dodoUst{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.dodoUst b{flex:1;font-size:18px;letter-spacing:-.3px}
.dodoUst button{width:44px;height:44px;border-radius:14px;border:1px solid var(--kenar);background:rgba(255,255,255,.08);color:var(--yazi);font-size:20px;padding:0}
.dodoSek{display:flex;gap:8px;padding:6px 16px 10px}
.dodoSek button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--kenar);background:rgba(255,255,255,.06);color:var(--soluk);font-family:inherit;font-size:15px;transition:all .2s}
.dodoSek button.aktif{background:var(--degrade);border-color:transparent;color:#0b0d14;font-weight:700;box-shadow:0 6px 18px rgba(124,156,255,.35)}
#dodoIcerik{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

/* ===== ECOLI AI: SOHBET ===== */
#dodoIcerik{display:flex;flex-direction:column;overflow:hidden;padding:0}
.sohbetAlan{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.bal{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.bal.ben{align-self:flex-end;background:var(--degrade);color:#0b0d14;border-bottom-right-radius:6px;box-shadow:0 6px 16px rgba(124,156,255,.3)}
.bal.ai{align-self:flex-start;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid var(--kenar);border-bottom-left-radius:6px}
.bal.yaziyor{color:var(--soluk)}
.bal.hata{border-color:rgba(255,122,122,.5);color:var(--kirmizi)}
.sohbetCip{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}
.sohbetCip button{flex:none;min-height:40px;padding:0 14px;border-radius:14px;border:1px solid var(--kenar);background:rgba(255,255,255,.07);color:var(--yazi);font-family:inherit;font-size:14px}
.sohbetGiris{display:flex;flex-direction:column;gap:6px;padding:8px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08)}
.sohbetEkler{display:flex;gap:8px;align-items:center}
.ekBtn{flex:none;width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.08);color:var(--soluk);font-size:20px;cursor:pointer;display:grid;place-items:center}
.dodoFotoOnizleme{position:relative;max-height:180px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25)}
.dodoFotoOnizleme img{width:100%;height:auto;display:block}
.dodoFotoOnizleme button{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer}
.sifreSatir{display:flex;gap:8px;align-items:center;margin-top:0}
.sifreSatir input{flex:1;min-width:0;margin-top:0;width:auto}
.gozBtn{flex:none;width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.08);color:var(--soluk);font-size:18px;cursor:pointer;display:grid;place-items:center}
.gunBaslik{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.gunBaslik span{font-weight:600;font-size:15px}
.kisibtn{flex:none;width:42px;height:32px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:var(--soluk);font-size:11px;cursor:pointer;border:1px solid var(--kenar)}
.kisibtn:disabled{opacity:.4;cursor:not-allowed}
.kisibtn:hover:not(:disabled){background:rgba(255,255,255,.15)}

/* ===== YANLIŞLAR ===== */
.yFoto{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px;background:rgba(0,0,0,.25)}

/* ===== KONU TAKİP ===== */
.dersBaslik{display:block;width:100%;background:none;border:0;padding:0;color:inherit;font-family:inherit;font-size:inherit;text-align:left}
.konuSatir{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.konuSatir span{flex:1;font-size:15px}
.durum{flex:none;min-width:112px;min-height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--kenar);font-family:inherit;font-size:12.5px;font-weight:600;transition:all .2s}
.durum.d0{background:rgba(255,122,122,.14);color:var(--kirmizi);border-color:rgba(255,122,122,.4)}
.durum.d1{background:rgba(255,209,102,.16);color:var(--sari);border-color:rgba(255,209,102,.45)}
.durum.d2{background:rgba(91,227,176,.18);color:var(--yesil);border-color:rgba(91,227,176,.5)}

/* ===== HAFTALIK ANALİZ TABLO ===== */
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;text-align:left}
th{color:var(--soluk);font-weight:600;font-size:12px}
td{color:var(--yazi);font-size:13px;border-top:1px solid rgba(255,255,255,.04)}
tr:first-child td{border-top:none}

/* Netlify rozetini gizle */
.netlify-badge, [class*="netlify"] {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="baslik">Lyrica</h1>
    <p id="tarih"></p>
  </header>
  <main id="icerik"></main>
  <nav id="menu"></nav>
</div>

<!-- DODO AI: sağ alt buton ve panel -->
<button id="dodoBtn" type="button" aria-label="Ecoli AI'yı aç" onclick="dodoAc()">🦤</button>
<div id="dodoPerde" onclick="dodoKapat()"></div>
<section id="dodoPanel" role="dialog" aria-modal="true" aria-label="Ecoli AI">
  <div class="dodoUst"><b>🦤 Ecoli AI</b><button type="button" aria-label="Kapat" onclick="dodoKapat()">✕</button></div>
  <div class="dodoSek" id="dodoSek"></div>
  <div id="dodoIcerik"></div>
</section>

<script>
const KEY = 'yks_v1';
const varsayilan = () => ({
  surum: 1,
  profil: {ad:'', alan:'SAY', universite:'', bolum:'', hedefSiralama:'', tytHedef:'', aytHedef:'', sinavTarihi:''},
  kaynaklar: [], gorevler: [], sureler: [], aktifSayac: null, haftalar: [], kacan: {}, program: {},
  yanlislar: [],   
  konuTakip: {},   
  rutinler: []     
});

let S = varsayilan();
try {
  const k = localStorage.getItem(KEY);
  if (k) S = Object.assign(varsayilan(), JSON.parse(k));
} catch (e) { console.error('Veri okunamadı', e); }

function kaydet() { localStorage.setItem(KEY, JSON.stringify(S)); }

function bugun() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function yeniId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function kart(baslik, govde) { return '<div class="kart"><h2>' + baslik + '</h2>' + govde + '</div>'; }

const DERSLER = ['Matematik','Geometri','Fizik','Kimya','Biyoloji','Türkçe','Edebiyat','Tarih','Coğrafya','Felsefe','Din Kültürü','Diğer'];
const GUNLER = [[1,'Pzt'],[2,'Sal'],[3,'Çar'],[4,'Per'],[5,'Cum'],[6,'Cmt'],[0,'Paz']];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tarihStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function tarihDon(s) { const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function gunAdi(s) { return tarihDon(s).toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long'}); }

function videoEtiket(k, nos) {
  if (nos.some(n => k.videolar[n-1] && k.videolar[n-1].baslik))
    return nos.map(n => n + '. ' + ((k.videolar[n-1] && k.videolar[n-1].baslik) || 'video')).join(', ');
  if (nos.length === 1) return nos[0] + '. video';
  if (nos.length === 2) return nos[0] + '. ve ' + nos[1] + '. video';
  return nos.slice(0, -1).join(', ') + ' ve ' + nos[nos.length-1] + '. video';
}

function gorevOlustur(k, nos, ds) {
  const linkler = []; let genel = false;
  nos.forEach(n => {
    const v = k.videolar[n-1];
    if (v && v.link) linkler.push({no:n, url:v.link});
    else if (k.link) genel = true;
  });
  if (genel) linkler.push({no:0, url:k.link});
  return {id:yeniId(), tarih:ds, metin:k.ders + ' - ' + k.ad + ': ' + videoEtiket(k, nos),
          kaynakId:k.id, videoNos:nos, linkler:linkler, tur:'kaynak', bitti:false};
}

function planYenile() {
  const bg = bugun();
  S.kaynaklar.forEach(k => {
    const biten = new Set(); let bugunBiten = 0;
    S.gorevler.filter(g => g.kaynakId === k.id && g.bitti).forEach(g => {
      g.videoNos.forEach(n => biten.add(n));
      if (g.tarih === bg) bugunBiten += g.videoNos.length;
    });
    S.gorevler = S.gorevler.filter(g => {
      if (g.kaynakId === k.id && !g.bitti) {
        if (g.tarih < bg) S.kacan[g.tarih] = (S.kacan[g.tarih] || 0) + 1;
        return false;
      }
      return true;
    });
    const kalan = [];
    for (let n = 1; n <= k.toplamVideo; n++) if (!biten.has(n)) kalan.push(n);
    if (!k.gunler.length || !k.gunlukVideo) return;
    const d = tarihDon(k.baslangic > bg ? k.baslangic : bg);
    let guard = 0;
    while (kalan.length && guard++ < 3000) {
      if (k.gunler.includes(d.getDay())) {
        const ds = tarihStr(d);
        const kota = k.gunlukVideo - (ds === bg ? bugunBiten : 0);
        if (kota > 0) S.gorevler.push(gorevOlustur(k, kalan.splice(0, kota), ds));
      }
      d.setDate(d.getDate() + 1);
    }
  });
  kaydet();
}

function kaynakEkle() {
  const al = id => document.getElementById(id).value.trim();
  const videolar = al('k_liste').split('\n').map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/https?:\/\/\S+/); const link = m ? m[0] : '';
    return {baslik: s.replace(link, '').replace(/\|/g, '').trim(), link: link};
  });
  const toplam = videolar.length || parseInt(al('k_toplam'));
  const gunluk = parseInt(al('k_gunluk'));
  const gunler = [...document.querySelectorAll('#k_gunler input:checked')].map(i => +i.value);
  if (!al('k_ad')) return alert('Kaynak adını yaz.');
  if (!toplam || toplam < 1) return alert('Toplam video sayısını yaz ya da video listesini yapıştır.');
  if (!gunluk || gunluk < 1) return alert('Günde kaç video izleyeceğini yaz.');
  if (!al('k_baslangic')) return alert('Başlangıç tarihini seç.');
  if (!gunler.length) return alert('En az bir çalışma günü seç.');
  S.kaynaklar.push({id:yeniId(), ders:al('k_ders'), ad:al('k_ad'), link:al('k_link'), toplamVideo:toplam,
                    gunlukVideo:gunluk, baslangic:al('k_baslangic'), gunler:gunler, videolar:videolar});
  planYenile();
  tabGit('kaynaklar');
}

function kaynakSil(id) {
  if (!confirm('Bu kaynak ve görevleri silinsin mi?')) return;
  S.kaynaklar = S.kaynaklar.filter(k => k.id !== id);
  S.gorevler = S.gorevler.filter(g => g.kaynakId !== id);
  kaydet();
  tabGit('kaynaklar');
}

function linklerHtml(g) {
  return g.linkler.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">▶ ' +
    (l.no ? l.no + '. video' : "YouTube'da aç") + '</a>').join('');
}

function kaynakKart(k) {
  let biten = 0;
  S.gorevler.forEach(g => { if (g.kaynakId === k.id && g.bitti) biten += g.videoNos.length; });
  const yuzde = Math.round(biten / k.toplamVideo * 100);
  const gunler = GUNLER.filter(g => k.gunler.includes(g[0])).map(g => g[1]).join(', ');
  const son = S.gorevler.filter(g => g.kaynakId === k.id).map(g => g.tarih).sort().pop();
  return kart(esc(k.ders) + ' - ' + esc(k.ad),
    '<p class="soluk">' + biten + ' / ' + k.toplamVideo + ' video bitti (%' + yuzde + ')</p>' +
    '<div class="cubuk"><div style="width:' + yuzde + '%"></div></div>' +
    '<p class="soluk">Günde ' + k.gunlukVideo + ' video: ' + gunler + '</p>' +
    (son ? '<p class="soluk">Tahmini bitiş: ' + gunAdi(son) + '</p>' : '') +
    '<button class="btn ikincil" onclick="kaynakSil(\'' + k.id + '\')">Sil</button>');
}

function planOnizleme() {
  const bas = bugun(); const d = tarihDon(bas); d.setDate(d.getDate() + 7);
  const bit = tarihStr(d);
  const liste = S.gorevler.filter(g => g.tur === 'kaynak' && g.tarih >= bas && g.tarih < bit)
                          .sort((a, b) => a.tarih < b.tarih ? -1 : a.tarih > b.tarih ? 1 : 0);
  if (!liste.length) return kart('Önümüzdeki 7 gün', '<p class="soluk">Bu hafta planlı video yok.</p>');
  let html = '', son = '';
  liste.forEach(g => {
    if (g.tarih !== son) { html += '<h3 class="gun">' + gunAdi(g.tarih) + '</h3>'; son = g.tarih; }
    html += '<div class="plan">' + (g.bitti ? '✓ ' : '') + esc(g.metin) + '<br>' + linklerHtml(g) + '</div>';
  });
  return kart('Önümüzdeki 7 gün', html);
}

function kaynakFormu() {
  const dersler = DERSLER.map(x => '<option>' + x + '</option>').join('');
  const cipler = GUNLER.map(g => '<label class="cip"><input type="checkbox" value="' + g[0] + '"' +
    (g[0] >= 1 && g[0] <= 5 ? ' checked' : '') + '><span>' + g[1] + '</span></label>').join('');
  return kart('Yeni kaynak ekle',
    '<label class="alan">Ders<select id="k_ders">' + dersler + '</select></label>' +
    '<label class="alan">Kaynak adı<input type="text" id="k_ad" placeholder="Örn: Matematik Kampı"></label>' +
    '<label class="alan">YouTube linki (liste veya kanal)<input type="url" id="k_link" placeholder="https://youtube.com/..."></label>' +
    '<label class="alan">Toplam video sayısı<input type="number" id="k_toplam" min="1" inputmode="numeric"></label>' +
    '<label class="alan">Günde kaç video<input type="number" id="k_gunluk" min="1" value="2" inputmode="numeric"></label>' +
    '<label class="alan">Başlangıç tarihi<input type="date" id="k_baslangic" value="' + bugun() + '"></label>' +
    '<label class="alan">Çalışılacak günler</label><div class="cipler" id="k_gunler">' + cipler + '</div>' +
    '<label class="alan">İstersen tek tek videolar (her satır bir video: başlık ve/veya link)' +
    '<textarea id="k_liste" placeholder="Limit giriş https://youtu.be/...&#10;Süreklilik https://youtu.be/..."></textarea></label>' +
    '<p class="soluk">Liste doldurursan toplam video sayısı listeden hesaplanır.</p>' +
    '<button class="btn" onclick="kaynakEkle()">Kaynağı ekle ve planla</button>');
}

/* ===== GÖREVLER VE RUTİNLER ===== */
let sonTik = null;
function bugunGorevleri() {
  const bg = bugun();
  return S.gorevler.filter(g => g.tarih === bg || g.bitisGun === bg || (g.tur === 'elle' && !g.bitti && g.tarih < bg));
}

function seriHesapla() {
  const gunler = new Set(S.gorevler.filter(g => g.bitti && g.bitisGun).map(g => g.bitisGun));
  const d = new Date();
  if (!gunler.has(tarihStr(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (gunler.has(tarihStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function gorevTikle(id) {
  const g = S.gorevler.find(x => x.id === id);
  if (!g) return;
  g.bitti = !g.bitti;
  if (g.bitti) g.bitisGun = bugun(); else delete g.bitisGun;
  planYenile();
  sonTik = g.bitti ? id : null;
  ekranCiz();
  sonTik = null;
}

const RUTIN_LISTESI = ['Paragraf', 'Problem', 'Geometri'];
function rutinTikle(rutinAdi) {
  const bg = bugun();
  if (!S.rutinler) S.rutinler = [];
  const i = S.rutinler.findIndex(r => r.tarih === bg && r.rutin === rutinAdi);
  if (i >= 0) S.rutinler.splice(i, 1);
  else S.rutinler.push({tarih: bg, rutin: rutinAdi});
  kaydet(); ekranCiz();
}

function rutinlerKart() {
  const bg = bugun();
  const tamamlananlar = new Set((S.rutinler || []).filter(r => r.tarih === bg).map(r => r.rutin));
  const html = RUTIN_LISTESI.map(rutin => {
    const bitti = tamamlananlar.has(rutin);
    return '<div class="gorev' + (bitti ? ' bitti' : '') + '">' +
      '<label class="tikalan"><input type="checkbox"' + (bitti ? ' checked' : '') + ' onchange="rutinTikle(\'' + rutin + '\')"></label>' +
      '<div class="gmetin"><b>' + rutin + '</b> (Günlük Rutin)</div></div>';
  }).join('');
  return kart('Günlük Rutinler', html);
}

function elleEkle() {
  const tur = document.getElementById('e_tur').value;
  const m = document.getElementById('e_metin').value.trim();
  if (!m) return alert('Ne yapacağını yaz.');
  S.gorevler.push({id:yeniId(), tarih:bugun(), metin:(tur === 'Diğer' ? m : tur + ': ' + m),
                   kaynakId:null, videoNos:[], linkler:[], tur:'elle', bitti:false});
  kaydet(); ekranCiz();
}

function elleSil(id) {
  S.gorevler = S.gorevler.filter(g => g.id !== id);
  kaydet(); ekranCiz();
}

function gorevSatir(g) {
  return '<div class="gorev' + (g.bitti ? ' bitti' : '') + (g.id === sonTik ? ' pop' : '') + '">' +
    '<label class="tikalan"><input type="checkbox"' + (g.bitti ? ' checked' : '') + ' onchange="gorevTikle(\'' + g.id + '\')"></label>' +
    '<div class="gmetin">' + esc(g.metin) + (g.linkler.length ? '<br>' + linklerHtml(g) : '') + '</div>' +
    (g.tur === 'elle' ? '<button class="sil" onclick="elleSil(\'' + g.id + '\')">✕</button>' : '') + '</div>';
}

function gorevlerEkrani() {
  const bg = bugun();
  const liste = bugunGorevleri().sort((a, b) => (a.bitti ? 1 : 0) - (b.bitti ? 1 : 0));

  // Günlük rutınleri yüzde ve sayıya ekle
  const rutinlerListesi = RUTIN_LISTESI.map(rutin => ({
    adi: rutin,
    bitti: (S.rutinler || []).some(r => r.tarih === bg && r.rutin === rutin)
  }));
  const rutinBitti = rutinlerListesi.filter(r => r.bitti).length;
  const rutinToplam = rutinlerListesi.length;

  const gorevBitti = liste.filter(g => g.bitti).length;
  const toplamGorev = liste.length + rutinToplam;
  const toplamBitti = gorevBitti + rutinBitti;
  const yuzde = toplamGorev ? Math.round(toplamBitti / toplamGorev * 100) : 0;

  const seri = seriHesapla();
  const st = toplamlar().bugun;

  const ust = kart('Bugün ne yaptım',
    '<div class="satir"><div class="sayi">%' + yuzde + '</div><div class="soluk">' + toplamBitti + ' / ' + toplamGorev + ' görev tamam</div></div>' +
    '<div class="cubuk"><div style="width:' + yuzde + '%"></div></div>' +
    '<p>🔥 ' + (seri ? seri + ' gün seri' : 'Seri yok. Bugün bir görev bitirip seriyi başlat.') + '</p>' +
    (st ? '<p>⏱️ Bugün ' + sureYaz(st) + ' çalıştın.</p>': ''));

  const gorevlerHtml = kart('Bugünün görevleri', liste.length ? liste.map(gorevSatir).join('')
    : '<p class="soluk">Bugün için kaynak veya elle eklenmiş görev yok.</p>');

  const form = kart('Görev ekle',
    '<label class="alan">Türü<select id="e_tur"><option>Soru çözümü</option><option>Deneme</option><option>Konu tekrarı</option><option>Diğer</option></select></label>' +
    '<label class="alan">Ne yapacaksın?<input type="text" id="e_metin" placeholder="Örn: Matematik 40 soru"></label>' +
    '<button class="btn" onclick="elleEkle()">Ekle</button>');

  return '<button class="btn ikincil" style="margin:0 0 12px" onclick="tabGit(\'program\')">📅 Haftalık program</button>' + rutinlerKart() + ust + gorevlerHtml + form;
}

/* ===== SÜRE TUTUCU ===== */
let secilenDers = 'Matematik';
function gecen(a) { return a.biriken + (a.devam ? Date.now() - a.devam : 0); }
function saatYaz(sn) {
  const h = Math.floor(sn / 3600), m = Math.floor(sn % 3600 / 60), s = sn % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function sureYaz(sn) {
  if (sn < 60) return sn + ' sn';
  const h = Math.floor(sn / 3600), m = Math.floor(sn % 3600 / 60);
  return h ? h + ' sa ' + m + ' dk' : m + ' dk';
}
function haftaBasi() {
  const d = new Date();
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return tarihStr(d);
}
function toplamlar() {
  const bg = bugun(), hb = haftaBasi();
  let b = 0, h = 0, t = 0;
  S.sureler.forEach(x => { t += x.sn; if (x.gun === bg) b += x.sn; if (x.gun >= hb) h += x.sn; });
  const a = S.aktifSayac;
  if (a) { const e = Math.floor(gecen(a) / 1000); t += e; b += e; h += e; }
  return {bugun:b, hafta:h, toplam:t};
}
function sayacBaslat() {
  if (S.aktifSayac) return;
  const now = Date.now();
  S.aktifSayac = {ders:secilenDers, baslangic:now, biriken:0, devam:now};
  kaydet(); ekranCiz();
}
function sayacDuraklat() {
  const a = S.aktifSayac;
  if (!a || !a.devam) return;
  a.biriken += Date.now() - a.devam; a.devam = null;
  kaydet(); ekranCiz();
}
function sayacDevam() {
  const a = S.aktifSayac;
  if (!a || a.devam) return;
  a.devam = Date.now();
  kaydet(); ekranCiz();
}
function sayacBitir() {
  const a = S.aktifSayac;
  if (!a) return;
  const sn = Math.round(gecen(a) / 1000);
  if (sn >= 1) S.sureler.push({id:yeniId(), ders:a.ders, baslangic:a.baslangic, bitis:Date.now(), sn:sn, gun:bugun()});
  S.aktifSayac = null;
  kaydet(); ekranCiz();
}
function sureSil(id) {
  S.sureler = S.sureler.filter(x => x.id !== id);
  kaydet(); ekranCiz();
}

function guncelleCanli() {
  if (aktifTab !== 'sure') return;
  const a = S.aktifSayac;
  const s = document.getElementById('saat');
  if (s && a) s.textContent = saatYaz(Math.floor(gecen(a) / 1000));
  const t = toplamlar();
  [['t_bugun', t.bugun], ['t_hafta', t.hafta], ['t_toplam', t.toplam]].forEach(x => {
    const e = document.getElementById(x[0]);
    if (e) e.textContent = sureYaz(x[1]);
  });
}
setInterval(guncelleCanli, 1000);

function sureEkrani() {
  const a = S.aktifSayac, t = toplamlar();
  let ust;
  if (a) {
    ust = '<p class="soluk">' + esc(a.ders) + (a.devam ? '' : ' (duraklatıldı)') + '</p>' +
      '<div class="halka' + (a.devam ? ' calisiyor' : '') + '"><div class="saat" id="saat">' + saatYaz(Math.floor(gecen(a) / 1000)) + '</div></div>' +
      '<div class="ikili">' +
      (a.devam ? '<button class="btn ikincil" onclick="sayacDuraklat()">⏸ Duraklat</button>'
               : '<button class="btn" onclick="sayacDevam()">▶ Devam</button>') +
      '<button class="btn" onclick="sayacBitir()">⏹ Bitir</button></div>';
  } else {
    const dersler = DERSLER.map(x => '<option' + (x === secilenDers ? ' selected' : '') + '>' + x + '</option>').join('');
    ust = '<label class="alan">Ders<select onchange="secilenDers=this.value">' + dersler + '</select></label>' +
      '<button class="btn" onclick="sayacBaslat()">▶ Başlat</button>';
  }
  const toplamKart = kart('Çalışma süren',
    '<div class="toplam"><span>Bugün</span><b id="t_bugun">' + sureYaz(t.bugun) + '</b></div>' +
    '<div class="toplam"><span>Bu hafta</span><b id="t_hafta">' + sureYaz(t.hafta) + '</b></div>' +
    '<div class="toplam"><span>Toplam</span><b id="t_toplam">' + sureYaz(t.toplam) + '</b></div>');
  const son = S.sureler.slice(-8).reverse().map(x =>
    '<div class="kayit"><div>' + esc(x.ders) + ': ' + sureYaz(x.sn) + '<br><span class="soluk">' + gunAdi(x.gun) + '</span></div>' +
    '<button class="sil" onclick="sureSil(\'' + x.id + '\')">✕</button></div>').join('');
  return kart('Kronometre', ust) + toplamKart + (son ? kart('Son kayıtlar', son) : '');
}

/* ===== PROFİL VE HEDEFLER ===== */
function bildir(m) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}
function baslikGuncelle() {
  document.getElementById('baslik').textContent = S.profil.ad ? 'Merhaba, ' + S.profil.ad : 'Lyrica';
}
function kalanGun() {
  const s = S.profil.sinavTarihi;
  if (!s) return null;
  return Math.round((tarihDon(s) - tarihDon(bugun())) / 86400000);
}
function profilKaydet() {
  const al = id => document.getElementById(id).value.trim();
  const tyt = al('p_tyt'), ayt = al('p_ayt');
  const alan = document.querySelector('input[name="p_alan"]:checked');
  S.profil = {ad:al('p_ad'), alan:(alan ? alan.value : 'SAY'), universite:al('p_uni'), bolum:al('p_bolum'),
              hedefSiralama:al('p_sira'), tytHedef:tyt, aytHedef:ayt, sinavTarihi:al('p_tarih')};
  kaydet(); baslikGuncelle(); ekranCiz();
  bildir('Kaydedildi ✓');
}
function hedeflerEkrani() {
  const p = S.profil, g = kalanGun();
  let sayac = g === null ? '<p class="soluk">Sınav tarihini aşağıdan gir.</p>' : (g < 0 ? '<p class="soluk">Tarih geçmiş.</p>' : '<div class="sayi">' + g + ' gün</div>');
  const alanlar = ['SAY', 'EA', 'SÖZ', 'DİL'].map(a =>
    '<label class="cip"><input type="radio" name="p_alan" value="' + a + '"' + (p.alan === a ? ' checked' : '') + '><span>' + a + '</span></label>').join('');

  const form = kart('Profil ve hedefler',
    '<label class="alan">Adın<input type="text" id="p_ad" value="' + esc(p.ad) + '"></label>' +
    '<label class="alan">Alanın</label><div class="cipler">' + alanlar + '</div>' +
    '<label class="alan">Hedef üniversite<input type="text" id="p_uni" value="' + esc(p.universite) + '"></label>' +
    '<label class="alan">Hedef bölüm<input type="text" id="p_bolum" value="' + esc(p.bolum) + '"></label>' +
    '<label class="alan">Hedef sıralama<input type="number" id="p_sira" value="' + esc(p.hedefSiralama) + '"></label>' +
    '<label class="alan">TYT hedef net<input type="number" id="p_tyt" value="' + esc(p.tytHedef) + '"></label>' +
    '<label class="alan">AYT hedef net<input type="number" id="p_ayt" value="' + esc(p.aytHedef) + '"></label>' +
    '<label class="alan">Sınav tarihi<input type="date" id="p_tarih" value="' + esc(p.sinavTarihi) + '"></label>' +
    '<button class="btn" onclick="profilKaydet()">Kaydet</button>');

  return '<button class="btn ikincil" style="margin:0 0 12px" onclick="tabGit(\'konular\')">📚 Konu takip matrisi</button>' +
    kart('Sınava kalan süre', sayac) + form;
}

/* ===== YANLIŞLAR (HATA HAVUZU) ===== */
let yanlisTaslak = {ders:'Matematik', konu:'', not:'', foto:''};
let yanlisFormAcik = false;
let yanlisPop = null;

async function yanlisFotoSec(inp) {
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  const u = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const m = Math.max(im.width, im.height), o = m > 800 ? 800 / m : 1;
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * o); c.height = Math.round(im.height * o);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    yanlisTaslak.foto = c.toDataURL('image/jpeg', 0.55);
    ekranCiz();
  };
  im.src = u;
}
function yanlisFotoKaldir() { yanlisTaslak.foto = ''; ekranCiz(); }
function yanlisKaydet() {
  const t = yanlisTaslak, konu = t.konu.trim();
  if (!konu) return alert('Konuyu yaz.');
  S.yanlislar.push({id:yeniId(), tarih:bugun(), ders:t.ders, konu:konu, soruNotu:t.not.trim(), fotoUrl:t.foto, cozuldu:false});
  kaydet();
  yanlisTaslak = {ders:t.ders, konu:'', not:'', foto:''};
  yanlisFormAcik = false;
  ekranCiz(); bildir('Depoya eklendi ✓');
}
function yanlisSil(id) {
  if (!confirm('Silinsin mi?')) return;
  S.yanlislar = S.yanlislar.filter(x => x.id !== id);
  kaydet(); ekranCiz();
}
function yanlisDurumTogle(id) {
  const x = S.yanlislar.find(q => q.id === id);
  if (!x) return;
  x.cozuldu = !x.cozuldu;
  kaydet(); ekranCiz();
}
function yanlislarEkrani() {
  const cozulmeyenler = S.yanlislar.filter(x => !x.cozuldu);
  const cozulenler = S.yanlislar.filter(x => x.cozuldu);

  const listeHtml = (liste, baslik) => {
    if (!liste.length) return '';
    return '<h3 class="gun">' + baslik + '</h3>' + liste.map(y =>
      '<div class="gorev' + (y.cozuldu ? ' bitti' : '') + '">' +
      '<label class="tikalan"><input type="checkbox"' + (y.cozuldu ? ' checked' : '') + ' onchange="yanlisDurumTogle(\'' + y.id + '\')"></label>' +
      '<div class="gmetin"><b>' + esc(y.ders) + ' - ' + esc(y.konu) + '</b><br><span class="soluk">' + esc(y.soruNotu || 'Not yok') + '</span>' +
      (y.fotoUrl ? '<img class="yFoto" alt="" src="' + y.fotoUrl + '">' : '') + '</div>' +
      '<button class="sil" onclick="yanlisSil(\'' + y.id + '\')">✕</button></div>'
    ).join('');
  };

  const form = yanlisFormAcik ? kart('Yeni Yanlış Soru',
    '<label class="alan">Ders<select onchange="yanlisTaslak.ders=this.value">' + DERSLER.map(d => '<option' + (d === yanlisTaslak.ders ? ' selected' : '') + '>' + d + '</option>').join('') + '</select></label>' +
    '<label class="alan">Konu<input type="text" placeholder="Örn: Türev" value="' + esc(yanlisTaslak.konu) + '" oninput="yanlisTaslak.konu=this.value"></label>' +
    '<label class="alan">Not<textarea placeholder="Neden yanlış yaptın?" oninput="yanlisTaslak.not=this.value">' + esc(yanlisTaslak.not) + '</textarea></label>' +
    '<button class="btn ikincil" onclick="document.getElementById(\'fSec\').click()">📷 Fotoğraf Ekle</button>' +
    '<input type="file" id="fSec" accept="image/*" hidden onchange="yanlisFotoSec(this)">' +
    (yanlisTaslak.foto ? '<img class="yFoto" src="' + yanlisTaslak.foto + '"><button class="btn ikincil" onclick="yanlisFotoKaldir()">Fotoğrafı Kaldır</button>' : '') +
    '<button class="btn" onclick="yanlisKaydet()">Depoya Kaydet</button>' +

  ) : '<button class="btn" onclick="yanlisFormAcik=true;ekranCiz()">＋ Yanlış Soru Ekle</button>';

  const icerik = S.yanlislar.length ? listeHtml(cozulmeyenler, 'Çözülmeyi Bekleyenler') + listeHtml(cozulenler, 'Çözülenler (Arşiv)')
    : '<p class="soluk">Henüz depoda yanlış soru yok.</p>';

}

].map(m => ({tur: m[0], ders: m[1], konular: m[2].split('|')}));

const KONU_DURUM = ['Çalışılmadı', 'Konu Bitti', 'Tekrar/Soru ✓'];
let konuTur = 'TYT';
let konuAcik = -1;

function konuAnahtar(m, k) { return m.tur + '|' + m.ders + '|' + k; }
function konuDurumDegis(i, j) {
  const m = MUF[i], a = konuAnahtar(m, m.konular[j]);
  const n = ((S.konuTakip[a] || 0) + 1) % 3;
  if (n) S.konuTakip[a] = n; else delete S.konuTakip[a];
  kaydet(); ekranCiz();
}
function konuAc(i) { konuAcik = konuAcik === i ? -1 : i; ekranCiz(); }
function konuTurDegis(t) { konuTur = t; konuAcik = -1; ekranCiz(); }
function konuSay(m) {
  const s = [0, 0, 0];
  m.konular.forEach(k => s[S.konuTakip[konuAnahtar(m, k)] || 0]++);
  return s;
}
function konuPuan(s) { return s[2] + s[1] * 0.5; }
function konuYuzde(m) { return Math.round(konuPuan(konuSay(m)) / m.konular.length * 100); }

function konuTakipEkrani() {
  const liste = MUF.map((m, i) => ({m: m, i: i})).filter(x => x.m.tur === konuTur);
  let puan = 0, say = 0;
  liste.forEach(x => { puan += konuPuan(konuSay(x.m)); say += x.m.konular.length; });
  const genel = say ? Math.round(puan / say * 100) : 0;
  const alt = '<div class="alt">' + ['TYT', 'AYT'].map(t =>
    '<button class="' + (konuTur === t ? 'aktif' : '') + '" onclick="konuTurDegis(\'' + t + '\')">' + t + '</button>').join('') + '</div>';

  const ust = kart('Konu takip · ' + konuTur,
    '<div class="satir"><div class="sayi">%' + genel + '</div><div class="soluk">genel ilerleme</div></div>' +
    '<div class="cubuk"><div style="width:' + genel + '%"></div></div>' +
    '<button class="btn ikincil" onclick="tabGit(\'hedefler\')">← Hedeflere dön</button>');

  const dersler = liste.map(x => {
    const m = x.m, s = konuSay(m), y = konuYuzde(m), acik = konuAcik === x.i;
    const baslik = '<button class="dersBaslik" onclick="konuAc(' + x.i + ')">' +
      '<div class="toplam" style="border:0;padding:0"><b>' + esc(m.ders) + '</b><b>%' + y + ' ' + (acik ? '▲' : '▼') + '</b></div>' +
      '<div class="cubuk"><div style="width:' + y + '%"></div></div>' +
      '<span class="soluk">' + s[0] + ' çalışılmadı · ' + s[1] + ' bitti · ' + s[2] + ' tamam</span></button>';
    const satirlar = acik ? m.konular.map((k, j) => {
      const d = S.konuTakip[konuAnahtar(m, k)] || 0;
      return '<div class="konuSatir"><span>' + esc(k) + '</span>' +
        '<button class="durum d' + d + '" onclick="konuDurumDegis(' + x.i + ',' + j + ')">' + KONU_DURUM[d] + '</button></div>';
    }).join('') : '';
    return '<div class="kart">' + baslik + satirlar + '</div>';
  }).join('');

  return alt + ust + dersler;
}

/* ===== HAFTALIK GÜNCELLEME VE ANALİZ ===== */
const TYT_DERS = [['turkce','Türkçe',40],['sosyal','Sosyal Bilimler',20],['mat','Temel Matematik',40],['fen','Fen Bilimleri',20]];
const AYT_DERS = {
  'SAY':[['mat','Matematik',40],['fizik','Fizik',14],['kimya','Kimya',13],['biyo','Biyoloji',13]],
  'EA':[['mat','Matematik',40],['edeb','Edebiyat',24],['tar1','Tarih-1',10],['cog1','Coğrafya-1',6]],
  'SÖZ':[['edeb','Edebiyat',24],['tar1','Tarih-1',10],['cog1','Coğrafya-1',6],['tar2','Tarih-2',11],['cog2','Coğrafya-2',11]],
  'DİL':[['dil','Yabancı Dil',80]]
};
let haftaSecili = haftaBasi();
let haftaAlt = 'form';
let analizSecim = 'genel';

function haftaBul(m) { return S.haftalar.find(h => h.hafta === m); }
function netToplam(o) {
  let t = 0, var_ = false;
  Object.values(o || {}).forEach(x => { if (typeof x === 'number') { t += x; var_ = true; } });
  return var_ ? t : null;
}
function netYaz(n) { return n === null ? '-' : String(Math.round(n * 100) / 100).replace('.', ','); }

function tumDersler(alan) {
  const tyt = TYT_DERS.map(d => ({key: 'tyt_' + d[0], ad: d[1], max: d[2], tur: 'TYT'}));
  const ayt = (AYT_DERS[alan] || []).map(d => ({key: 'ayt_' + d[0], ad: d[1], max: d[2], tur: 'AYT'}));
  return [...tyt, ...ayt];
}

function haftaCalismaSaatleri(haftaBaslangic) {
  const bas = tarihDon(haftaBaslangic);
  const bit = new Date(bas); bit.setDate(bit.getDate() + 7);
  const basStr = tarihStr(bas), bitStr = tarihStr(bit);
  const sonuc = {toplam: 0, dersler: {}};
  (S.sureler || []).forEach(s => {
    if (s.gun >= basStr && s.gun < bitStr) {
      sonuc.toplam += s.sn;
      sonuc.dersler[s.ders] = (sonuc.dersler[s.ders] || 0) + s.sn;
    }
  });
  return sonuc;
}

function haftaFormu() {
  const m = haftaBul(haftaSecili), alan = (m && m.alan) || S.profil.alan || 'SAY';
  const girdiler = (on, liste, veri) => liste.map(d =>
    '<label class="alan">' + d[1] + '<input type="number" id="' + on + d[0] + '" step="0.25" min="0" max="' + d[2] + '" value="' + (veri && typeof veri[d[0]] === 'number' ? veri[d[0]] : '') + '"></label>').join('');

    '<div class="soluk" style="margin-top:8px"><b>Bu hafta çalışma:</b> ' +

    ' · Toplam: ' + sureYaz(saatler.toplam) + '</div>' : '';

  const haftalarSirali = [...S.haftalar].sort((a, b) => b.hafta.localeCompare(a.hafta));
    const listeHtml = haftalarSirali.length ? haftalarSirali.map(h => {
    const tytNet = netToplam(h.tyt), aytNet = netToplam(h.ayt);
    const saatlerH = haftaCalismaSaatleri(h.hafta);
    const dersDagilim = saatlerH.toplam ? '<div class="soluk" style="font-size:12px;margin-top:4px">' + 
        Object.entries(saatlerH.dersler).map(([d, sn]) => d + ': ' + sureYaz(sn)).join(' · ') + '</div>' : '';
    return '<div class="kayit" style="padding:10px 0;border-top:1px solid rgba(255,255,255,.08);position:relative">' +
      '<button class="btn ikincil" style="position:absolute;top:10px;right:0;padding:0 12px;min-height:32px;line-height:32px;font-size:12px" onclick="haftaSecili=\'' + h.hafta + '\';haftaAlt=\'form\';ekranCiz()">Düzenle</button>' +
      '<div style="padding-right:80px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:0"><b>' + gunAdi(h.hafta) + '</b> <span class="soluk">(' + h.alan + ')</span></div>' +
      '<div class="soluk" style="font-size:13px;white-space:nowrap;flex-shrink:0">TYT: ' + netYaz(tytNet) + ' · AYT: ' + netYaz(aytNet) + ' · ⏱ ' + sureYaz(saatlerH.toplam) + '</div>' +
      '</div>' +
      dersDagilim +
      '</div></div>';
  }).join('') : '<p class="soluk">Henüz kayıtlı hafta yok.</p>';
  
  return kart('Hafta Deneme Kaydı',
    '<label class="alan">Hafta başlangıcı (Pazartesi)<input type="date" id="h_tarih" value="' + haftaSecili + '" onchange="haftaSecili=this.value;ekranCiz()"></label>') +
    kart('TYT Netleri', girdiler('n_tyt_', TYT_DERS, m && m.tyt)) +
    kart('AYT Netleri (' + alan + ')', girdiler('n_ayt_', AYT_DERS[alan] || [], m && m.ayt) +
    '<button class="btn" style="margin-top:14px" onclick="haftaKaydet()">Kaydet</button>') +
    saatlerHtml +
    kart('Kayıtlı Haftalar (Yeni → Eski)', listeHtml);
}

function haftaKaydet() {
  const alan = S.profil.alan || 'SAY', al = id => document.getElementById(id).value.trim();
  const oku = (on, liste) => {
    const o = {};
    for (const d of liste) { const n = parseFloat(al(on + d[0])); if (!isNaN(n)) o[d[0]] = n; }
    return o;
  };
  const kayit = {hafta: haftaSecili, alan: alan, tyt: oku('n_tyt_', TYT_DERS), ayt: oku('n_ayt_', AYT_DERS[alan] || [])};
  const i = S.haftalar.findIndex(h => h.hafta === haftaSecili);
  if (i >= 0) S.haftalar[i] = kayit; else S.haftalar.push(kayit);
  S.haftalar.sort((a, b) => a.hafta.localeCompare(b.hafta));
  kaydet(); ekranCiz(); bildir('Hafta kaydedildi ✓');
}

function grafikCiz(canvasId, haftalar, cizilecekler) {
  const cvs = document.getElementById(canvasId);
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = cvs.clientWidth, h = 180;
  cvs.width = w * dpr; cvs.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  // Tüm verileri topla min/max için
  let tumVeriler = [];
  cizilecekler.forEach(c => {
    const veri = haftalar.map(c.veriAl).filter(v => v !== null);
    tumVeriler.push(...veri);
  });
  if (!tumVeriler.length) { ctx.fillStyle = '#9aa3ba'; ctx.font = '14px system-ui'; ctx.textAlign = 'center'; ctx.fillText('Veri yok', w/2, h/2); return; }
  const minV = Math.min(...tumVeriler), maxV = Math.max(...tumVeriler);
  const range = maxV - minV || 1;
  const padding = 40, stepX = (w - 2 * padding) / (haftalar.length - 1 || 1);

  // Grid çizgileri + Y eksen değerleri (sol tarafta)
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#9aa3ba';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = padding + (h - 2 * padding) * i / 4;
    ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(w - padding, y); ctx.stroke();
    // Y eksen sayısı
    const val = maxV - (maxV - minV) * i / 4;
    ctx.fillText(Math.round(val * 10) / 10, padding - 8, y + 3);
  }

  // Her çizgi için
  cizilecekler.forEach(({veriAl, renk, ad}) => {
    ctx.strokeStyle = renk; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    let ilk = true;
    haftalar.forEach((hafta, i) => {
      const val = veriAl(hafta);
      const x = padding + i * stepX;
      const y = val !== null ? h - padding - (val - minV) / range * (h - 2 * padding) : null;
      if (y !== null) {
        if (ilk) { ctx.moveTo(x, y); ilk = false; } else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();

    // Noktalar + Üzerine değer yaz
    ctx.fillStyle = renk;
    haftalar.forEach((hafta, i) => {
      const val = veriAl(hafta);
      const x = padding + i * stepX;
      const y = val !== null ? h - padding - (val - minV) / range * (h - 2 * padding) : null;
      if (y !== null) {
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
        // Değer yaz (nokta üstü)
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(netYaz(val), x, y - 8);
        ctx.fillStyle = renk; // rengi geri al
      }
    });
  });

  // X eksen etiketleri (tarih)
  ctx.fillStyle = '#9aa3ba'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
  haftalar.forEach((hafta, i) => {
    const x = padding + i * stepX;
    const d = tarihDon(hafta);
    ctx.fillText((d.getMonth() + 1) + '/' + d.getDate(), x, h - 8);
  });
}

function analizEkrani() {
  const haftalar = [...S.haftalar].sort((a, b) => a.hafta.localeCompare(b.hafta));
  if (!haftalar.length) return kart('Analiz', '<p class="soluk">Henüz deneme kaydı yok.</p>');

  const alan = S.profil.alan || 'SAY';
  const dersler = tumDersler(alan);
  const secimler = ['genel', 'genel_tyt', 'genel_ayt', ...dersler.map(d => d.key)].map(k => {
    let etiket;
    if (k === 'genel') etiket = 'Genel (TYT+AYT)';
    else if (k === 'genel_tyt') etiket = 'Genel (TYT)';
    else if (k === 'genel_ayt') etiket = 'Genel (AYT)';
    else etiket = (dersler.find(d => d.key === k)?.ad || k) + ' (' + (dersler.find(d => d.key === k)?.tur || '') + ')';
    return '<option value="' + k + '"' + (analizSecim === k ? ' selected' : '') + '>' + etiket + '</option>';
  }).join('');
  
  const veriFonksiyonlari = {
    genel: h => {
      const tyt = netToplam(h.tyt), ayt = netToplam(h.ayt);
      return (tyt !== null || ayt !== null) ? (tyt || 0) + (ayt || 0) : null;
    },
    genel_tyt: h => netToplam(h.tyt),
    genel_ayt: h => netToplam(h.ayt)
  };
  dersler.forEach(d => {
    veriFonksiyonlari[d.key] = h => {
      const src = d.tur === 'TYT' ? h.tyt : h.ayt;
      const field = d.key.replace(d.tur.toLowerCase() + '_', '');
      return src && typeof src[field] === 'number' ? src[field] : null;
    };
  });

  // Çoklu çizgi desteği için
  let cizilecekler = [];
  let grafikBaslik = 'Net Grafiği';
  if (analizSecim === 'genel') {
    cizilecekler = [
      {key: 'genel_tyt', renk: '#8fb0ff', ad: 'TYT Genel'},
      {key: 'genel_ayt', renk: '#5be3b0', ad: 'AYT Genel'}
    ];
    grafikBaslik = 'Genel Net Grafiği (TYT / AYT)';
  } else if (analizSecim === 'genel_tyt') {
    cizilecekler = [{key: 'genel_tyt', renk: '#8fb0ff', ad: 'TYT Genel'}];
    grafikBaslik = 'TYT Genel Net Grafiği';
  } else if (analizSecim === 'genel_ayt') {
    cizilecekler = [{key: 'genel_ayt', renk: '#5be3b0', ad: 'AYT Genel'}];
    grafikBaslik = 'AYT Genel Net Grafiği';
  } else {
    cizilecekler = [{key: analizSecim, renk: '#5be3b0', ad: dersler.find(d => d.key === analizSecim)?.ad || analizSecim}];

/* ===== HAFTALIK PROGRAM ===== */
const GUN_ADLARI = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
let programHafta = haftaBasi();
let programKopilamisGun = null;
function gunTarihi(m, i) { const d = tarihDon(m); d.setDate(d.getDate() + i); return tarihStr(d); }
function programAl(m) { if (!S.program[m]) S.program[m] = [[], [], [], [], [], [], []]; return S.program[m]; }
function programUygula() {
  const idler = new Set();
  Object.keys(S.program).forEach(m => {
    S.program[m].forEach((liste, i) => {
      const ds = gunTarihi(m, i);
      liste.forEach(it => {
        idler.add(it.id);
        const g = S.gorevler.find(x => x.progId === it.id);
        if (!g) S.gorevler.push({id:yeniId(), tarih:ds, metin:it.metin, kaynakId:null, videoNos:[], linkler:[], tur:'program', progId:it.id, bitti:false});
        else if (!g.bitti) { g.tarih = ds; g.metin = it.metin; }
      });
    });
  });
  S.gorevler = S.gorevler.filter(g => g.tur !== 'program' || g.bitti || idler.has(g.progId));
  kaydet();
}
function programEkle(i) {
  const m = document.getElementById('pg_' + i).value.trim();
  if (!m) return;
  // Eğer bu gün bugünse, programHafta ne olursa olsun bu haftanın tarihini kullan
  const ds = gunTarihi(programHafta, i);
  const bugunStr = bugun();
  const hedefTarih = (ds === bugunStr) ? bugunStr : ds;
  
  programAl(programHafta)[i].push({id:yeniId(), metin:m});
  programUygula(); 
  ekranCiz();
}
function programSil(i, id) {
  const l = programAl(programHafta)[i];
  const k = l.findIndex(x => x.id === id);
  if (k >= 0) l.splice(k, 1);
  programUygula(); ekranCiz();
}
function programKopala(i) {
  const m = programHafta;
  const liste = (S.program[m] || [])[i] || [];
  programKopilamisGun = {hafta: m, gun: i, liste: JSON.parse(JSON.stringify(liste))};
  bildir(GUN_ADLARI[i] + ' kopyalandı');
  ekranCiz();
}
function programYapistir(i) {
  if (!programKopilamisGun) return bildir('Önce bir gün kopyalayın');
  const m = programHafta;
  if (!S.program[m]) S.program[m] = [[],[],[],[],[],[],[]];
  S.program[m][i] = JSON.parse(JSON.stringify(programKopilamisGun.liste));
  programUygula();
  ekranCiz();
  bildir('Yapıştırıldı');
}
function programKopalaHafta() {
  const onceki = gunTarihi(programHafta, -7);
  const oncekiListe = S.program[onceki];
  if (!oncekiListe) return bildir('Önceki haftada program yok');
  S.program[programHafta] = JSON.parse(JSON.stringify(oncekiListe));
  programUygula();
  ekranCiz();
  bildir('Önceki hafta kopyalandı');
}
function programEkrani() {
  const m = programHafta, bg = bugun();
  const buHafta = haftaBasi();
  const fark = Math.round((tarihDon(programHafta) - tarihDon(buHafta)) / 86400000 / 7);
  const haftaEtiket = fark === 0 ? 'Bu Hafta' : (fark > 0 ? '+' + fark + ' Hafta Sonra' : fark + ' Hafta Önce');
  const ust = kart('Haftalık Program',
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
    '<span style="font-size:14px;color:var(--soluk)">Görüntülenen: <b>' + haftaEtiket + '</b> (' + gunAdi(programHafta) + ' - ' + gunAdi(gunTarihi(programHafta, 6)) + ')</span>' +
    '<div class="ikili" style="gap:4px"><button class="btn ikincil" onclick="programHafta=buHafta;ekranCiz()" style="min-height:36px;padding:0 12px;font-size:13px">📍 Bu Hafta</button>' +
    '<button class="btn ikincil" onclick="programHafta=gunTarihi(programHafta,-7);ekranCiz()">◀</button>' +
    '<button class="btn" onclick="programKopalaHafta()">📋 Kopyala</button>' +
    '<button class="btn ikincil" onclick="programHafta=gunTarihi(programHafta,7);ekranCiz()">▶</button></div>' +
    '</div>' +
    '<button class="btn ikincil" onclick="tabGit(\'gorevler\')" style="margin-top:10px">← Görevlere Dön</button>');
  const gunler = GUN_ADLARI.map((ad, i) => {
    const ds = gunTarihi(m, i), liste = (S.program[m] || [])[i] || [];
    return kart('',
      '<div class="gunBaslik"><span>' + esc(ad) + (ds === bg ? ' (Bugün)' : '') + '</span>' +
      '<button class="kisibtn" onclick="programKopala(' + i + ')">Kopla</button>' +
      '<button class="kisibtn" onclick="programYapistir(' + i + ')"' + (!programKopilamisGun ? ' disabled' : '') + '>Yapıştır</button></div>' +
      liste.map(it => '<div class="kayit"><div>' + esc(it.metin) + '</div><button class="sil" onclick="programSil(' + i + ',\'' + it.id + '\')">✕</button></div>').join('') +
      '<div class="ekleSatir"><input type="text" id="pg_' + i + '" placeholder="Örn: 40 soru" onkeydown="if(event.key===\'Enter\')programEkle(' + i + ')"><button class="btn" onclick="programEkle(' + i + ')">Ekle</button></div>');
  }).join('');
  return ust + gunler;
}

async function dodoFotoSec(inp) {
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  if (!f.type.startsWith('image/')) return alert('Sadece resim dosyası seçin.');
  const u = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const m = Math.max(im.width, im.height), o = m > 800 ? 800 / m : 1;
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * o); c.height = Math.round(im.height * o);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    dodoFotoBase64 = c.toDataURL('image/jpeg', 0.55);
    dodoFotoOnizlemeGuncelle();
  };
  im.src = u;
}
function dodoFotoKaldir() { dodoFotoBase64 = null; dodoFotoOnizlemeGuncelle(); }
function dodoFotoOnizlemeGuncelle() {
  const el = document.getElementById('dodoFotoOnizleme');
  if (!el) return;
  if (dodoFotoBase64) {
    el.innerHTML = '<img src="' + dodoFotoBase64 + '" alt=""><button type="button" onclick="dodoFotoKaldir()">✕</button>';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
}

const DODO_KEY = 'dodo_api_anahtari';
const DODO_MODEL = 'gemini-1.5-flash';
function dodoOku(k, v) { try { const x = localStorage.getItem(k); return x ? JSON.parse(x) : v; } catch (e) { return v; } }
function dodoYaz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function dodoAnahtar() { try { return localStorage.getItem(DODO_KEY) || ''; } catch (e) { return ''; } }
function dodoModel() { return (dodoOku('dodo_ayar', {}).model || '').trim() || DODO_MODEL; }

async function geminiIstek(icerikler, sistem, gorselBase64) {
  const anahtar = dodoAnahtar();
  if (!anahtar) throw new Error('API anahtarı yok. Ayarlar sekmesinden Gemini API anahtarını ekle.');
  const iceriklerKopya = JSON.parse(JSON.stringify(icerikler));
  if (gorselBase64) {
    const sonKullanici = iceriklerKopya.length - 1;
    if (sonKullanici >= 0 && iceriklerKopya[sonKullanici].role === 'user') {
      const base64Veri = gorselBase64.split(',')[1];
      iceriklerKopya[sonKullanici].parts.push({
        inline_data: {mime_type: 'image/jpeg', data: base64Veri}
      });
    }
  }
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(dodoModel()) + ':generateContent', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-goog-api-key': anahtar},
    body: JSON.stringify({
      systemInstruction: {parts: [{text: sistem}]},
      contents: iceriklerKopya,
      generationConfig: {temperature: 0.5, maxOutputTokens: 800, topP: 0.9, topK: 40}
    })
  });
  if (!r.ok) throw new Error('API bağlantı hatası (' + r.status + '). Anahtarını kontrol et.');
  const j = await r.json();
  const metin = (j.candidates?.[0]?.content?.parts || []).map(x => x.text || '').join('');
  if (!metin) throw new Error('Yapay zeka boş yanıt verdi.');
  return metin;
}

let dodoFotoBase64 = null;
let dodoMesgul = false;
async function dodoMesajGonder(metin, gorunen) {
  if (dodoMesgul) return;
  const giris = document.getElementById('sohbetGiris');
  const hazir = typeof metin === 'string';
  const m = String(hazir ? metin : (giris ? giris.value : '')).trim();
  if (!m && !dodoFotoBase64) return;
  const l = dodoOku('dodo_sohbet', []);
  const kullaniciMesaji = {r: 'user', t: m, g: gorunen || '', z: Date.now(), hasImage: !!dodoFotoBase64};
  l.push(kullaniciMesaji);
  dodoYaz('dodo_sohbet', l.slice(-60));
  const gonderilenFoto = dodoFotoBase64;
  dodoFotoBase64 = null;
  dodoFotoOnizlemeGuncelle();
  if (giris && !hazir) giris.value = '';
  dodoMesgul = true;
  dodoSohbetCiz(true);
  try {
    const gecmis = l.slice(-10);
    while (gecmis.length && gecmis[0].r !== 'user') gecmis.shift();
    const yanit = await geminiIstek(
      gecmis.map(x => ({role: x.r, parts: [{text: x.t}]})), 
      dodoSistemMetni(),
      gonderilenFoto
    );
    const l2 = dodoOku('dodo_sohbet', []);
    l2.push({r: 'model', t: yanit.trim(), z: Date.now()});
    dodoYaz('dodo_sohbet', l2.slice(-60));
    dodoSohbetCiz();
  } catch (e) {
    const l2 = dodoOku('dodo_sohbet', []); l2.pop();
    dodoYaz('dodo_sohbet', l2);
    if (giris && !hazir) giris.value = m;
    dodoSohbetCiz(false, e.message);
  } finally { dodoMesgul = false; }
}

      genel: h => { const tyt = netToplam(h.tyt), ayt = netToplam(h.ayt); return (tyt !== null || ayt !== null) ? (tyt || 0) + (ayt || 0) : null; },

      genel_ayt: h => netToplam(h.ayt)
    };
    dersler.forEach(d => { veriFonksiyonlari[d.key] = h => { const src = d.tur === 'TYT' ? h.tyt : h.ayt; const field = d.key.replace(d.tur.toLowerCase() + '_', ''); return src && typeof src[field] === 'number' ? src[field] : null; }; });

    let cizilecekler = [];
    if (analizSecim === 'genel') {
      cizilecekler = [
        {veriAl: veriFonksiyonlari.genel_tyt, renk: '#8fb0ff', ad: 'TYT Genel'},
        {veriAl: veriFonksiyonlari.genel_ayt, renk: '#5be3b0', ad: 'AYT Genel'}
      ];
    } else if (analizSecim === 'genel_tyt') {
      cizilecekler = [{veriAl: veriFonksiyonlari.genel_tyt, renk: '#8fb0ff', ad: 'TYT Genel'}];
    } else if (analizSecim === 'genel_ayt') {
      cizilecekler = [{veriAl: veriFonksiyonlari.genel_ayt, renk: '#5be3b0', ad: 'AYT Genel'}];
    } else {
      cizilecekler = [{veriAl: veriFonksiyonlari[analizSecim], renk: '#5be3b0', ad: dersler.find(d => d.key === analizSecim)?.ad || analizSecim}];
    }
    grafikCiz('haftaGrafik', haftalar, cizilecekler);
  }
}
function tabGit(id) {
  aktifTab = id; animasyon = true; tabCiz(); ekranCiz(); animasyon = false;
  document.getElementById('icerik').scrollTop = 0;
}

function yedekIndir() {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'yks-yedek-' + bugun() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
}

function yedekYukle(inp) {
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !data.surum) throw new Error('Geçersiz yedek');
      S = Object.assign(varsayilan(), data);
      kaydet();
      baslikGuncelle();
      ekranCiz();
      bildir('Yedek yüklendi ✓');
    } catch (e) { alert('Yükleme hatası: ' + e.message); }
  };
  r.readAsText(f);
}
